name: CI

on:
  pull_request:
    branches: [test, master]

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux headless test and release build
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS headless test and release build
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows headless test and release build
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The Unix SIGTERM integration test is cfg(unix); Windows still runs the
      # readiness and process-boundary tests and gets the same release build.
      - name: Test headless binary
        run: cargo test --all-targets --locked
      - name: Test node-service lifecycle surface
        run: cargo test --test node_service_e2e --test policy_e2e --locked
      - name: Compile platform-specific node security paths
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo check --all-targets --locked
      - name: Build release binary
        run: cargo build --release --bin omakure --target ${{ matrix.target }} --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo fmt --check

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test packaging_smoke --locked

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build node image
        run: docker build --tag omakure-node:ci .
      - name: Start node service and check health/readiness
        shell: bash
        run: |
          set -euo pipefail
          workspace_volume="omakure-workspace-ci"
          state_volume="omakure-node-state-ci"
          docker volume create "${workspace_volume}" >/dev/null
          docker volume create "${state_volume}" >/dev/null
          docker run --rm --user 0 \
            --volume "${workspace_volume}:/workspace" \
            --volume "${state_volume}:/var/lib/omakure" \
            --entrypoint /bin/sh omakure-node:ci \
            -c 'chown 10001:10001 /workspace /var/lib/omakure && chmod 0750 /workspace && chmod 0700 /var/lib/omakure'
          token='ci-node-service-token-with-enough-entropy-00001'
          docker run --detach --name omakure-node-ci \
            --env OMAKURE_API_TOKEN="${token}" \
            --volume "${workspace_volume}:/workspace" \
            --volume "${state_volume}:/var/lib/omakure" \
            --publish 127.0.0.1:7878:7878 \
            omakure-node:ci
          trap 'docker logs omakure-node-ci || true; docker rm -f omakure-node-ci || true; docker volume rm "${workspace_volume}" "${state_volume}" >/dev/null 2>&1 || true' EXIT
          for path in health ready; do
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:7878/v1/${path}"; then
                break
              fi
              if [[ "${attempt}" == 30 ]]; then
                echo "${path} did not become healthy" >&2
                exit 1
              fi
              sleep 1
            done
          done

  release-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version\s*=' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          tag="v${version}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "::error::Cargo.toml version ${version} already has tag ${tag} — bump the version before merging"
            exit 1
          fi
          if [[ ! -f "release-notes/${tag}.md" ]]; then
            echo "::error::Missing release-notes/${tag}.md — add release notes before merging"
            exit 1
          fi
          echo "Ready to release ${tag}"
