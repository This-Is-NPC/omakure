name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux headless test and release build
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            musl: false
            rustflags: ""
          - name: Linux musl static release build
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
            rustflags: ""
          - name: Linux ARM64 headless test and release build
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            musl: false
            rustflags: ""
          - name: Linux ARM64 musl static release build
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
            rustflags: ""
          - name: macOS headless test and release build
            os: macos-15-intel
            target: x86_64-apple-darwin
            musl: false
            rustflags: ""
          - name: macOS ARM64 headless test and release build
            os: macos-15
            target: aarch64-apple-darwin
            musl: false
            rustflags: ""
          - name: Windows headless test and release build
            os: windows-latest
            target: x86_64-pc-windows-msvc
            musl: false
            rustflags: "-C target-feature=+crt-static"
          - name: Windows ARM64 headless test and release build
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            musl: false
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Configure private macOS temporary directory
        if: contains(matrix.target, '-apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cd -- "${RUNNER_TEMP}" && pwd -P)"
          current_owner_group="$(id -u):$(id -g)"
          runner_owner_group="$(stat -f '%u:%g' "${runner_temp}")"
          [[ "${runner_owner_group}" == "${current_owner_group}" ]] || {
            echo "RUNNER_TEMP is not owned by the current user/group" >&2
            exit 1
          }
          tmpdir="${runner_temp}/omakure-tmp"
          [[ ! -L "${tmpdir}" ]] || {
            echo "refusing symlinked macOS temporary directory" >&2
            exit 1
          }
          if [[ ! -e "${tmpdir}" ]]; then
            mkdir "${tmpdir}"
          fi
          [[ -d "${tmpdir}" ]] || {
            echo "macOS temporary path is not a directory" >&2
            exit 1
          }
          physical_tmpdir="$(cd -- "${tmpdir}" && pwd -P)"
          [[ "${physical_tmpdir}" == "${tmpdir}" ]] || {
            echo "refusing non-physical macOS temporary directory" >&2
            exit 1
          }
          chmod 700 "${physical_tmpdir}"
          tmpdir_owner_group="$(stat -f '%u:%g' "${physical_tmpdir}")"
          [[ "${tmpdir_owner_group}" == "${current_owner_group}" ]] || {
            echo "macOS temporary directory is not owned by the current user/group" >&2
            exit 1
          }
          printf 'TMPDIR=%s\n' "${physical_tmpdir}" >> "${GITHUB_ENV}"

      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The Unix SIGTERM integration test is cfg(unix); Windows still runs the
      # readiness and process-boundary tests and gets the same release build.
      - name: Test headless binary
        run: cargo test --all-targets --locked
      - name: Test node-service lifecycle surface
        run: cargo test --test node_service_e2e --test policy_e2e --locked
      - name: Native protocol/build/lifecycle matrix (no Docker)
        run: cargo test --test direct_transport_contract --test node_service_e2e --locked
      # macOS and Windows runners have no usable Docker networking, so the
      # multi-container Health Plane gate cannot run there. They keep honest
      # native coverage instead: the frozen contract vectors, the bounded state
      # and migration suite, the Signal lifecycle, and the multi-node reporting
      # path that runs in-process rather than in containers.
      #
      # This adds no coverage over `--all-targets` above and is not meant to.
      # Like the two steps before it, it names the platform guarantee the docs
      # claim so a failure points at the claim instead of at a 900-test run.
      - name: Native Health Plane protocol/migration/lifecycle matrix (no Docker)
        run: >-
          cargo test --test health_plane_contract --test health_plane_state
          --test health_plane_signals --test health_plane_transport_e2e
          --test health_plane_feasibility --locked
      - name: Compile platform-specific node security paths
        if: contains(matrix.target, 'windows')
        run: cargo check --all-targets --locked
      # The MSVC release artifact is built with `+crt-static`
      # (.github/workflows/release.yml), but nothing in CI carried those flags.
      # With a vendored C dependency that gap hides CRT-linkage failures
      # (LNK2038/LNK4098) until a release tag, which is the worst place to find
      # them. Build the same way here.
      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --bin omakure --target ${{ matrix.target }} --locked
      - name: Verify musl binary is statically linked
        if: matrix.musl
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/omakure"
          compiler_machine="$(musl-gcc -dumpmachine)"
          case "${{ matrix.target }}" in
            x86_64-*) [[ "${compiler_machine}" == *x86_64* ]] ;;
            aarch64-*) [[ "${compiler_machine}" == *aarch64* ]] ;;
            *) echo "unexpected musl target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          file_output="$(file "${binary}")"
          echo "${file_output}"
          grep -Eqi 'static(ally|-pie) linked' <<<"${file_output}"
          case "${{ matrix.target }}" in
            x86_64-*) grep -Eqi 'x86-64|x86_64' <<<"${file_output}" ;;
            aarch64-*) grep -Eqi 'aarch64|ARM' <<<"${file_output}" ;;
          esac
          ! readelf -l "${binary}" | grep -q 'INTERP'
      - name: Run native release binary smoke test
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            target/${{ matrix.target }}/release/omakure.exe --version
          else
            target/${{ matrix.target }}/release/omakure --version
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo fmt --check
      # The certification gates are ~1,400 lines of bash and ~240 of YAML that
      # nothing else type-checks; a syntax error in them only surfaces as a
      # mid-run failure minutes into a Docker job.
      - name: Shell and YAML static validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/tasks/cert/* scripts/tasks/dev/smoke scripts/tasks/complexity-setup-test)
          (( ${#scripts[@]} >= 5 )) || { echo "expected the certification and complexity scripts; found ${#scripts[@]}" >&2; exit 1; }
          for script in "${scripts[@]}"; do bash -n "$script"; done
          # Fails on zero matches as well as on a parse error: a compose file
          # renamed or moved would otherwise leave this step green having
          # checked nothing.
          python3 - <<'PY'
          import glob, sys, yaml
          paths = sorted(glob.glob("ci/compose/*.yaml")) + sorted(glob.glob(".github/workflows/*.yml"))
          if len(paths) < 6:
              sys.exit(f"expected at least 6 YAML files to validate, found {len(paths)}")
          for path in paths:
              yaml.safe_load(open(path))
              print("ok", path)
          PY
          ./scripts/tasks/complexity-setup-test

  usage-artifacts:
    name: Usage documentation and KDL artifact contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Check generated Usage artifacts and reviewed losses
        run: cargo run --quiet --locked --features usage-generator --bin usage-kdl -- --check
      - name: Check generated Usage documentation
        run: scripts/tasks/usage-docs --check
      - name: Check generated operation catalog
        run: scripts/tasks/operation-catalog --check
  coverage:
    if: github.event_name == 'pull_request'
    name: Deterministic LLVM coverage and baseline gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Run authoritative local coverage gate
        env:
          COVERAGE_TOOL_ROOT: ${{ runner.temp }}/cargo-llvm-cov
        run: ./scripts/tasks/coverage

  complexity-informational:
    name: Rust complexity calibration and ratchet gate
    runs-on: ubuntu-latest
    concurrency:
      group: complexity-informational-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Acquire and verify pinned native analyzers
        run: ./scripts/tasks/complexity-setup
      - name: Check fixed corpus and fail-closed native guards
        run: ./scripts/tasks/complexity-test
      - name: Generate two canonical reports and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/quality/complexity-evidence
          ./scripts/tasks/complexity-report --source-root . \
            --output target/quality/complexity-report-a.json
          ./scripts/tasks/complexity-report --source-root . \
            --output target/quality/complexity-report-b.json
          cmp --silent target/quality/complexity-report-a.json \
            target/quality/complexity-report-b.json
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("target/quality/complexity-report-a.json").read_text())
          evidence = {
              "status": "success",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "sequence": int(os.environ["GITHUB_RUN_NUMBER"]),
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "schema_version": report["schema_version"],
              "canonical_sha256": report["canonical_sha256"],
              "candidates": report["candidates"],
              "source_accounting": report["source_accounting"],
              "audit": report["audit"],
              "provenance": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
                  "event": os.environ["GITHUB_EVENT_NAME"],
                  "ref": os.environ["GITHUB_REF"],
                  "sha": os.environ["GITHUB_SHA"],
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
          }
          Path("target/quality/complexity-evidence/run.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n"
          )
          PY
      - name: Enforce changed-function complexity ratchet
        run: |
          ./scripts/tasks/complexity-gate \
            --report target/quality/complexity-report-a.json \
            --repeat-report target/quality/complexity-report-b.json \
            --baseline quality/complexity/baseline.json \
            --exceptions quality/complexity/exceptions.json \
            --output target/quality/complexity-evidence/gate.json
      - name: Audit non-authoritative complexity evidence
        run: ./scripts/tasks/complexity-soak-audit --directory target/quality/complexity-evidence
      - name: Upload canonical complexity evidence
        uses: actions/upload-artifact@v4
        with:
          name: complexity-calibration-${{ github.run_id }}
          path: |
            target/quality/complexity-report-a.json
            target/quality/complexity-report-b.json
            target/quality/complexity-evidence/run.json
            target/quality/complexity-evidence/gate.json

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo test --test packaging_smoke --locked

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical Docker smoke certification
        run: ./scripts/tasks/cert/docker-smoke

  transport-certification:
    name: Linux canonical multi-node transport certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install certification inspection tools
        run: sudo apt-get update && sudo apt-get install --yes jq sqlite3
      - name: Run bounded canonical gate
        run: timeout --foreground --kill-after=15s 20m ./scripts/tasks/cert/transport
      - name: Verify Docker certification cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for resource in container network volume; do
            if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
              --filter name=omakure-transport-certification)"; then
              echo "unable to inspect certification $resource resources" >&2
              failures=1
            elif [[ -n "$remaining" ]]; then
              echo "certification $resource resources survived cleanup: $remaining" >&2
              failures=1
            fi
          done
          exit "$failures"

  health-plane-certification:
    name: Linux canonical multi-node Health Plane certification
    runs-on: ubuntu-latest
    # The job budget must contain every step ceiling below, not just the
    # longest one: 45m for the gate plus 60m for the cleanup test plus setup.
    #
    # `--kill-after` on those steps is 300s, not seconds. GNU timeout arms it
    # whenever it forwards or raises a signal, so a small value truncates the
    # gate's teardown and the always() sweep below then reports resources the
    # kill orphaned rather than a real cleanup defect.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install certification inspection tools
        run: sudo apt-get update && sudo apt-get install --yes jq sqlite3
      - name: Run the bounded Health Plane gate
        run: timeout --foreground --kill-after=300s 45m ./scripts/tasks/cert/health
      # ~10m observed: two induced shapes plus an interrupt whose teardown is
      # bounded at 1080s by the script itself. 30m is a 3x margin.
      - name: Verify cleanup after induced failure and interrupt
        run: timeout --foreground --kill-after=300s 60m ./scripts/tasks/cert/health-cleanup
      - name: Verify no Health Plane certification Docker resources survived
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for resource in container network volume; do
            if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
              --filter name=omakure-health-plane-certification)"; then
              echo "unable to inspect Health Plane certification $resource resources" >&2
              failures=1
            elif [[ -n "$remaining" ]]; then
              echo "Health Plane certification $resource resources survived cleanup: $remaining" >&2
              failures=1
            fi
          done
          exit "$failures"

  release-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version\s*=' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          tag="v${version}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "::error::Cargo.toml version ${version} already has tag ${tag} — bump the version before merging"
            exit 1
          fi
          echo "Ready to release ${tag}"
