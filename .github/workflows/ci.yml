name: CI

on:
  pull_request:
    branches: [test, master]

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux headless test and release build
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS headless test and release build
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows headless test and release build
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      # The Unix SIGTERM integration test is cfg(unix); Windows still runs the
      # readiness and process-boundary tests and gets the same release build.
      - name: Test headless binary
        run: cargo test --all-targets --locked
      - name: Test node-service lifecycle surface
        run: cargo test --test node_service_e2e --test policy_e2e --locked
      - name: Native protocol/build/lifecycle matrix (no Docker)
        run: cargo test --test direct_transport_contract --test node_service_e2e --locked
      # macOS and Windows runners have no usable Docker networking, so the
      # multi-container Health Plane gate cannot run there. They keep honest
      # native coverage instead: the frozen contract vectors, the bounded state
      # and migration suite, the Signal lifecycle, and the multi-node reporting
      # path that runs in-process rather than in containers.
      #
      # This adds no coverage over `--all-targets` above and is not meant to.
      # Like the two steps before it, it names the platform guarantee the docs
      # claim so a failure points at the claim instead of at a 900-test run.
      - name: Native Health Plane protocol/migration/lifecycle matrix (no Docker)
        run: >-
          cargo test --test health_plane_contract --test health_plane_state
          --test health_plane_signals --test health_plane_transport_e2e
          --test health_plane_feasibility --locked
      - name: Compile platform-specific node security paths
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo check --all-targets --locked
      # The MSVC release artifact is built with `+crt-static`
      # (.github/workflows/release.yml), but nothing in CI carried those flags.
      # With a vendored C dependency that gap hides CRT-linkage failures
      # (LNK2038/LNK4098) until a release tag, which is the worst place to find
      # them. Build the same way here.
      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --bin omakure --target ${{ matrix.target }} --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo fmt --check
      # The certification gates are ~1,400 lines of bash and ~240 of YAML that
      # nothing else type-checks; a syntax error in them only surfaces as a
      # mid-run failure minutes into a Docker job.
      - name: Shell and YAML static validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(.scripts/*.sh)
          (( ${#scripts[@]} >= 4 )) || { echo "expected the certification scripts; found ${#scripts[@]}" >&2; exit 1; }
          for script in "${scripts[@]}"; do bash -n "$script"; done
          # Fails on zero matches as well as on a parse error: a compose file
          # renamed or moved would otherwise leave this step green having
          # checked nothing.
          python3 - <<'PY'
          import glob, sys, yaml
          paths = sorted(glob.glob("compose*.yaml")) + sorted(glob.glob(".github/workflows/*.yml"))
          if len(paths) < 5:
              sys.exit(f"expected at least 5 YAML files to validate, found {len(paths)}")
          for path in paths:
              yaml.safe_load(open(path))
              print("ok", path)
          PY

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo test --test packaging_smoke --locked

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build node image
        run: timeout --foreground --kill-after=10s 10m docker build --tag omakure-node:ci .
      - name: Start node service and check health/readiness
        shell: bash
        run: |
          set -euo pipefail
          workspace_volume="omakure-workspace-ci"
          state_volume="omakure-node-state-ci"
           timeout --foreground --kill-after=5s 30s docker volume create "${workspace_volume}" >/dev/null
           timeout --foreground --kill-after=5s 30s docker volume create "${state_volume}" >/dev/null
           timeout --foreground --kill-after=5s 60s docker run --rm --user 0 \
            --volume "${workspace_volume}:/workspace" \
            --volume "${state_volume}:/var/lib/omakure" \
            --entrypoint /bin/sh omakure-node:ci \
            -c 'chown 10001:10001 /workspace /var/lib/omakure && chmod 0750 /workspace && chmod 0700 /var/lib/omakure'
          token='ci-node-service-token-with-enough-entropy-00001'
           timeout --foreground --kill-after=10s 60s docker run --detach --name omakure-node-ci \
            --env OMAKURE_API_TOKEN="${token}" \
            --volume "${workspace_volume}:/workspace" \
            --volume "${state_volume}:/var/lib/omakure" \
            --publish 127.0.0.1:7878:7878 \
            omakure-node:ci
           cleanup() {
             timeout --foreground --kill-after=5s 30s docker logs omakure-node-ci || true
             timeout --foreground --kill-after=5s 30s docker rm -f omakure-node-ci || true
             timeout --foreground --kill-after=5s 30s docker volume rm "${workspace_volume}" "${state_volume}" >/dev/null 2>&1 || true
           }
           trap cleanup EXIT
           for path in health ready; do
             for attempt in {1..30}; do
               if timeout --foreground --kill-after=2s 10s curl --fail --silent \
                 --connect-timeout 3 --max-time 8 "http://127.0.0.1:7878/v1/${path}"; then
                 break
              fi
              if [[ "${attempt}" == 30 ]]; then
                echo "${path} did not become healthy" >&2
                exit 1
              fi
               sleep 1
             done
           done
      # Self-containment, falsifiable rather than asserted. The runtime image
      # installs only bash, ca-certificates, curl, git, jq and tini, so if
      # `command -v lua` ever succeeds the base image gained a Lua package and
      # this proof has silently become decoration. Checking the absence first is
      # what keeps the second half meaningful.
      - name: Prove .lua runs with no system Lua in the image
        run: |
          set -euo pipefail
          if timeout --foreground --kill-after=5s 30s docker run --rm \
            --entrypoint /bin/sh omakure-node:ci -c 'command -v lua'; then
            echo "the runtime image now ships a system Lua; the embedded-runtime proof below is void" >&2
            exit 1
          fi
          output="$(timeout --foreground --kill-after=5s 60s docker run --rm \
            --entrypoint /bin/sh omakure-node:ci -c \
            'printf "print(\"lua runs: \" .. _VERSION)\n" > /tmp/probe.lua \
             && omakure --__omakure-lua-host /tmp/probe.lua')"
          echo "$output"
          case "$output" in
            "lua runs: Lua 5.4"*) ;;
            *) echo "the embedded Lua runtime did not execute the script" >&2; exit 1 ;;
          esac

      - name: Cleanup and verify Docker smoke resources
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          timeout --foreground --kill-after=5s 30s docker rm -f omakure-node-ci >/dev/null 2>&1 || true
          timeout --foreground --kill-after=5s 30s docker volume rm omakure-workspace-ci omakure-node-state-ci >/dev/null 2>&1 || true
          for name in omakure-node-ci omakure-workspace-ci omakure-node-state-ci; do
            for resource in container network volume; do
              if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
                --filter name="$name")"; then
                echo "unable to inspect Docker $resource resources for $name" >&2
                failures=1
              elif [[ -n "$remaining" ]]; then
                echo "Docker smoke $resource resources survived cleanup for $name: $remaining" >&2
                failures=1
              fi
            done
          done
          exit "$failures"

  transport-certification:
    name: Linux canonical multi-node transport certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install certification inspection tools
        run: sudo apt-get update && sudo apt-get install --yes jq sqlite3
      - name: Run bounded canonical gate
        run: timeout --foreground --kill-after=15s 20m ./.scripts/transport-certification.sh
      - name: Verify Docker certification cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for resource in container network volume; do
            if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
              --filter name=omakure-transport-certification)"; then
              echo "unable to inspect certification $resource resources" >&2
              failures=1
            elif [[ -n "$remaining" ]]; then
              echo "certification $resource resources survived cleanup: $remaining" >&2
              failures=1
            fi
          done
          exit "$failures"

  health-plane-certification:
    name: Linux canonical multi-node Health Plane certification
    runs-on: ubuntu-latest
    # The job budget must contain every step ceiling below, not just the
    # longest one: 45m for the gate plus 60m for the cleanup test plus setup.
    #
    # `--kill-after` on those steps is 300s, not seconds. GNU timeout arms it
    # whenever it forwards or raises a signal, so a small value truncates the
    # gate's teardown and the always() sweep below then reports resources the
    # kill orphaned rather than a real cleanup defect.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install certification inspection tools
        run: sudo apt-get update && sudo apt-get install --yes jq sqlite3
      - name: Run the bounded Health Plane gate
        run: timeout --foreground --kill-after=300s 45m ./.scripts/health-plane-certification.sh
      # ~10m observed: two induced shapes plus an interrupt whose teardown is
      # bounded at 1080s by the script itself. 30m is a 3x margin.
      - name: Verify cleanup after induced failure and interrupt
        run: timeout --foreground --kill-after=300s 60m ./.scripts/health-plane-certification-cleanup-test.sh
      - name: Verify no Health Plane certification Docker resources survived
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for resource in container network volume; do
            if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
              --filter name=omakure-health-plane-certification)"; then
              echo "unable to inspect Health Plane certification $resource resources" >&2
              failures=1
            elif [[ -n "$remaining" ]]; then
              echo "Health Plane certification $resource resources survived cleanup: $remaining" >&2
              failures=1
            fi
          done
          exit "$failures"

  release-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version\s*=' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          tag="v${version}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "::error::Cargo.toml version ${version} already has tag ${tag} — bump the version before merging"
            exit 1
          fi
          if [[ ! -f "release-notes/${tag}.md" ]]; then
            echo "::error::Missing release-notes/${tag}.md — add release notes before merging"
            exit 1
          fi
          echo "Ready to release ${tag}"
