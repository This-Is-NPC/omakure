name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: omakure
  RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_os: darwin
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            ext: zip
            bin: omakure.exe
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test headless binary
        run: cargo test --all-targets --locked

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --bin omakure --target ${{ matrix.target }} --locked

      - name: Package
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          out="${APP_NAME}-${version}-${{ matrix.asset_os }}-x86_64.${{ matrix.ext }}"
          dist="dist"
          mkdir -p "${dist}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${dist}/${{ matrix.bin }}"
            powershell -NoProfile -Command "Compress-Archive -Path \"${dist}\\${{ matrix.bin }}\" -DestinationPath \"${dist}\\${out}\" -Force"
            rm "${dist}/${{ matrix.bin }}"
          else
            bash .github/package-release.sh \
              "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
              "${dist}/${out}"
          fi

      - name: Verify archive contains only the headless binary
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${APP_NAME}-${RELEASE_TAG}-${{ matrix.asset_os }}-x86_64.${{ matrix.ext }}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            powershell -NoProfile -Command '$entries = (Get-ChildItem -Path (Join-Path (Get-Location) "dist\*.zip")).FullName | ForEach-Object { [IO.Compression.ZipFile]::OpenRead($_).Entries.FullName }; if ($entries.Count -ne 1 -or $entries[0] -ne "${{ matrix.bin }}") { throw "archive must contain only ${{ matrix.bin }}" }'
          else
            test "$(tar -tzf "${archive}")" = "${{ matrix.bin }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_os }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: release-notes/${{ env.RELEASE_TAG }}.md
