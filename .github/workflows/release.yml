name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: omakure
  RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x86_64
            ext: tar.gz
            bin: omakure
            rustflags: ""
          # Statically linked, so it runs on any Linux regardless of the host
          # glibc. This is the asset `install.sh` prefers on Linux.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_os: linux-musl
            asset_arch: x86_64
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: aarch64
            ext: tar.gz
            bin: omakure
            rustflags: ""
          # Native ARM64 musl build and smoke test. This is statically linked,
          # so it runs on any ARM64 Linux regardless of the host glibc.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux-musl
            asset_arch: aarch64
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: x86_64
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: aarch64
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x86_64
            ext: zip
            bin: omakure.exe
            rustflags: "-C target-feature=+crt-static"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: aarch64
            ext: zip
            bin: omakure.exe
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Configure private macOS temporary directory
        if: contains(matrix.target, '-apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cd -- "${RUNNER_TEMP}" && pwd -P)"
          current_owner_group="$(id -u):$(id -g)"
          runner_owner_group="$(stat -f '%u:%g' "${runner_temp}")"
          [[ "${runner_owner_group}" == "${current_owner_group}" ]] || {
            echo "RUNNER_TEMP is not owned by the current user/group" >&2
            exit 1
          }
          tmpdir="${runner_temp}/omakure-tmp"
          [[ ! -L "${tmpdir}" ]] || {
            echo "refusing symlinked macOS temporary directory" >&2
            exit 1
          }
          if [[ ! -e "${tmpdir}" ]]; then
            mkdir "${tmpdir}"
          fi
          [[ -d "${tmpdir}" ]] || {
            echo "macOS temporary path is not a directory" >&2
            exit 1
          }
          physical_tmpdir="$(cd -- "${tmpdir}" && pwd -P)"
          [[ "${physical_tmpdir}" == "${tmpdir}" ]] || {
            echo "refusing non-physical macOS temporary directory" >&2
            exit 1
          }
          chmod 700 "${physical_tmpdir}"
          tmpdir_owner_group="$(stat -f '%u:%g' "${physical_tmpdir}")"
          [[ "${tmpdir_owner_group}" == "${current_owner_group}" ]] || {
            echo "macOS temporary directory is not owned by the current user/group" >&2
            exit 1
          }
          printf 'TMPDIR=%s\n' "${physical_tmpdir}" >> "${GITHUB_ENV}"
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test headless binary
        run: cargo test --all-targets --locked
      - name: Test node-service lifecycle surface
        run: cargo test --test node_service_e2e --test policy_e2e --locked

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --bin omakure --target ${{ matrix.target }} --locked

      - name: Verify musl binary is statically linked
        if: endsWith(matrix.target, '-unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          compiler_machine="$(musl-gcc -dumpmachine)"
          case "${{ matrix.target }}" in
            x86_64-*) [[ "${compiler_machine}" == *x86_64* ]] ;;
            aarch64-*) [[ "${compiler_machine}" == *aarch64* ]] ;;
            *) echo "unexpected musl target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          file_output="$(file "${binary}")"
          echo "${file_output}"
          grep -Eqi 'static(ally|-pie) linked' <<<"${file_output}"
          case "${{ matrix.target }}" in
            x86_64-*) grep -Eqi 'x86-64|x86_64' <<<"${file_output}" ;;
            aarch64-*) grep -Eqi 'aarch64|ARM' <<<"${file_output}" ;;
          esac
          ! readelf -l "${binary}" | grep -q 'INTERP'

      - name: Run native release binary smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - name: Package
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          out="${APP_NAME}-${version}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.${{ matrix.ext }}"
          dist="dist"
          mkdir -p "${dist}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${dist}/${{ matrix.bin }}"
            powershell -NoProfile -Command "Compress-Archive -Path \"${dist}\\${{ matrix.bin }}\" -DestinationPath \"${dist}\\${out}\" -Force"
            rm "${dist}/${{ matrix.bin }}"
          else
            bash scripts/release/package-release.sh \
              "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
              "${dist}/${out}"
          fi

      - name: Verify archive contains only the headless binary
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${APP_NAME}-${RELEASE_TAG}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.${{ matrix.ext }}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            powershell -NoProfile -Command '$entries = [IO.Compression.ZipFile]::OpenRead("dist\${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.${{ matrix.ext }}").Entries.FullName; if ($entries.Count -ne 1 -or $entries[0] -ne "${{ matrix.bin }}") { throw "archive must contain only ${{ matrix.bin }}" }'
          else
            test "$(tar -tzf "${archive}")" = "${{ matrix.bin }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*

  transport-certification:
    name: Linux release transport certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install certification inspection tools
        run: sudo apt-get update && sudo apt-get install --yes jq sqlite3
      - name: Run bounded canonical gate
        run: timeout --foreground --kill-after=15s 20m ./scripts/tasks/cert/transport
      - name: Verify Docker certification cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for resource in container network volume; do
            if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
              --filter name=omakure-transport-certification)"; then
              echo "unable to inspect certification $resource resources" >&2
              failures=1
            elif [[ -n "$remaining" ]]; then
              echo "certification $resource resources survived cleanup: $remaining" >&2
              failures=1
            fi
          done
          exit "$failures"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, transport-certification]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          # Generated by GitHub from the commits since the previous tag.
          generate_release_notes: true
