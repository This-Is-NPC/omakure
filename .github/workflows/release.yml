name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: omakure
  RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            ext: tar.gz
            bin: omakure
            rustflags: ""
          # Statically linked, so it runs on any Linux regardless of the host
          # glibc. This is the asset `install.sh` prefers on Linux.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_os: linux-musl
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_os: darwin
            ext: tar.gz
            bin: omakure
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            ext: zip
            bin: omakure.exe
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test headless binary
        run: cargo test --all-targets --locked
      - name: Test node-service lifecycle surface
        run: cargo test --test node_service_e2e --test policy_e2e --locked

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --bin omakure --target ${{ matrix.target }} --locked

      - name: Package
        shell: bash
        run: |
          version="${RELEASE_TAG}"
          out="${APP_NAME}-${version}-${{ matrix.asset_os }}-x86_64.${{ matrix.ext }}"
          dist="dist"
          mkdir -p "${dist}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${dist}/${{ matrix.bin }}"
            powershell -NoProfile -Command "Compress-Archive -Path \"${dist}\\${{ matrix.bin }}\" -DestinationPath \"${dist}\\${out}\" -Force"
            rm "${dist}/${{ matrix.bin }}"
          else
            bash .github/package-release.sh \
              "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
              "${dist}/${out}"
          fi

      - name: Verify archive contains only the headless binary
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${APP_NAME}-${RELEASE_TAG}-${{ matrix.asset_os }}-x86_64.${{ matrix.ext }}"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            powershell -NoProfile -Command '$entries = (Get-ChildItem -Path (Join-Path (Get-Location) "dist\*.zip")).FullName | ForEach-Object { [IO.Compression.ZipFile]::OpenRead($_).Entries.FullName }; if ($entries.Count -ne 1 -or $entries[0] -ne "${{ matrix.bin }}") { throw "archive must contain only ${{ matrix.bin }}" }'
          else
            test "$(tar -tzf "${archive}")" = "${{ matrix.bin }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.asset_os }}
          path: dist/*

  transport-certification:
    name: Linux release transport certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install certification inspection tools
        run: sudo apt-get update && sudo apt-get install --yes jq sqlite3
      - name: Run bounded canonical gate
        run: timeout --foreground --kill-after=15s 20m ./.scripts/transport-certification.sh
      - name: Verify Docker certification cleanup
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for resource in container network volume; do
            if ! remaining="$(timeout --foreground --kill-after=5s 30s docker "$resource" ls -q \
              --filter name=omakure-transport-certification)"; then
              echo "unable to inspect certification $resource resources" >&2
              failures=1
            elif [[ -n "$remaining" ]]; then
              echo "certification $resource resources survived cleanup: $remaining" >&2
              failures=1
            fi
          done
          exit "$failures"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, transport-certification]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          # Generated by GitHub from the commits since the previous tag.
          generate_release_notes: true
