services:
  direct-a-token-init:
    image: omakure-direct-transport-e2e:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/curl.conf && chmod 0600 /token/tokens.toml /token/curl.conf
    volumes:
      - direct-a-token:/token
      - "${OMAKURE_DIRECT_A_TOKENS_FILE:?set OMAKURE_DIRECT_A_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_DIRECT_A_CURL_FILE:?set OMAKURE_DIRECT_A_CURL_FILE}:/input/curl.conf:ro"

  direct-b-token-init:
    image: omakure-direct-transport-e2e:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/curl.conf && chmod 0600 /token/tokens.toml /token/curl.conf
    volumes:
      - direct-b-token:/token
      - "${OMAKURE_DIRECT_B_TOKENS_FILE:?set OMAKURE_DIRECT_B_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_DIRECT_B_CURL_FILE:?set OMAKURE_DIRECT_B_CURL_FILE}:/input/curl.conf:ro"

  direct-c-token-init:
    image: omakure-direct-transport-e2e:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/curl.conf && chmod 0600 /token/tokens.toml /token/curl.conf
    volumes:
      - direct-c-token:/token
      - "${OMAKURE_DIRECT_C_TOKENS_FILE:?set OMAKURE_DIRECT_C_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_DIRECT_C_CURL_FILE:?set OMAKURE_DIRECT_C_CURL_FILE}:/input/curl.conf:ro"

  direct-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: omakure-direct-transport-e2e:local
    depends_on:
      direct-a-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    ports:
      - "127.0.0.1:${DIRECT_A_HTTP_PORT:-17878}:7878"
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "0"
      - --no-scheduler
      - --capability
      - node:read
    volumes:
      - direct-a-state:/var/lib/omakure
      - direct-a-config:/etc/omakure
      - direct-a-token:/run/secrets

  direct-b:
    image: omakure-direct-transport-e2e:local
    depends_on:
      direct-b-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    ports:
      - "127.0.0.1:${DIRECT_B_HTTP_PORT:-17879}:7878"
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "0"
      - --no-scheduler
      - --capability
      - node:read
    volumes:
      - direct-b-state:/var/lib/omakure
      - direct-b-config:/etc/omakure
      - direct-b-token:/run/secrets

  direct-c:
    image: omakure-direct-transport-e2e:local
    depends_on:
      direct-c-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    volumes:
      - direct-c-state:/var/lib/omakure
      - direct-c-token:/run/secrets

volumes:
  direct-a-state:
  direct-b-state:
  direct-a-config:
  direct-b-config:
  direct-c-state:
  direct-a-token:
  direct-b-token:
  direct-c-token:
