# Canonical Linux certification topology. The runner owns the project name and
# removes every volume; do not use this file as a persistent deployment sample.
services:
  cert-a-token-init:
    image: omakure-node:transport-certification
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/client.token /token/client.token && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/client.token /token/curl.conf && chmod 0600 /token/tokens.toml /token/client.token /token/curl.conf
    volumes:
      - cert-a-token:/token
      - "${OMAKURE_CERT_A_TOKENS_FILE:?set OMAKURE_CERT_A_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_CERT_A_CLIENT_FILE:?set OMAKURE_CERT_A_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_CERT_A_CURL_FILE:?set OMAKURE_CERT_A_CURL_FILE}:/input/curl.conf:ro"

  cert-b-token-init:
    image: omakure-node:transport-certification
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/client.token /token/client.token && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/client.token /token/curl.conf && chmod 0600 /token/tokens.toml /token/client.token /token/curl.conf
    volumes:
      - cert-b-token:/token
      - "${OMAKURE_CERT_B_TOKENS_FILE:?set OMAKURE_CERT_B_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_CERT_B_CLIENT_FILE:?set OMAKURE_CERT_B_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_CERT_B_CURL_FILE:?set OMAKURE_CERT_B_CURL_FILE}:/input/curl.conf:ro"

  cert-c-token-init:
    image: omakure-node:transport-certification
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/client.token /token/client.token && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/client.token /token/curl.conf && chmod 0600 /token/tokens.toml /token/client.token /token/curl.conf
    volumes:
      - cert-c-token:/token
      - "${OMAKURE_CERT_C_TOKENS_FILE:?set OMAKURE_CERT_C_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_CERT_C_CLIENT_FILE:?set OMAKURE_CERT_C_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_CERT_C_CURL_FILE:?set OMAKURE_CERT_C_CURL_FILE}:/input/curl.conf:ro"

  cert-adversary-token-init:
    image: omakure-node:transport-certification
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/client.token /token/client.token && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/client.token /token/curl.conf && chmod 0600 /token/tokens.toml /token/client.token /token/curl.conf
    volumes:
      - cert-adversary-token:/token
      - "${OMAKURE_CERT_ADVERSARY_TOKENS_FILE:?set OMAKURE_CERT_ADVERSARY_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_CERT_ADVERSARY_CLIENT_FILE:?set OMAKURE_CERT_ADVERSARY_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_CERT_ADVERSARY_CURL_FILE:?set OMAKURE_CERT_ADVERSARY_CURL_FILE}:/input/curl.conf:ro"

  cert-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: omakure-node:transport-certification
    hostname: cert-a
    depends_on:
      cert-a-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "0"
      - --no-scheduler
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
      - --capability
      - discovery:read
    volumes:
      - cert-a-state:/var/lib/omakure
      - cert-a-config:/etc/omakure
      - cert-a-workspace:/workspace
      - cert-a-token:/run/secrets
      - cert-a-runtime:/run/omakure

  cert-b:
    image: omakure-node:transport-certification
    hostname: cert-b
    depends_on:
      cert-b-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "0"
      - --no-scheduler
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
      - --capability
      - discovery:read
    ports:
      - "127.0.0.1:${OMAKURE_CERT_B_DIRECT_PORT:-17889}:7879"
    volumes:
      - cert-b-state:/var/lib/omakure
      - cert-b-config:/etc/omakure
      - cert-b-workspace:/workspace
      - cert-b-token:/run/secrets
      - cert-b-runtime:/run/omakure

  cert-c:
    image: omakure-node:transport-certification
    hostname: cert-c
    depends_on:
      cert-c-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "0"
      - --no-scheduler
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
      - --capability
      - discovery:read
    ports:
      - "127.0.0.1:${OMAKURE_CERT_C_DIRECT_PORT:-17890}:7879"
    volumes:
      - cert-c-state:/var/lib/omakure
      - cert-c-config:/etc/omakure
      - cert-c-workspace:/workspace
      - cert-c-token:/run/secrets
      - cert-c-runtime:/run/omakure

  cert-adversary:
    image: omakure-node:transport-certification
    hostname: cert-adversary
    depends_on:
      cert-adversary-token-init:
        condition: service_completed_successfully
    environment:
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "0"
      - --no-scheduler
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
    volumes:
      - cert-adversary-state:/var/lib/omakure
      - cert-adversary-config:/etc/omakure
      - cert-adversary-workspace:/workspace
      - cert-adversary-token:/run/secrets
      - cert-adversary-runtime:/run/omakure

  # Used only by the induced cleanup test. Compose creates cert-a resources,
  # then this service exits non-zero while --abort-on-container-exit is active.
  cert-induced-failure:
    image: omakure-node:transport-certification
    depends_on:
      cert-a:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 1; exit 42"]

volumes:
  cert-a-state:
  cert-a-config:
  cert-a-workspace:
  cert-a-token:
  cert-a-runtime:
  cert-b-state:
  cert-b-config:
  cert-b-workspace:
  cert-b-token:
  cert-b-runtime:
  cert-c-state:
  cert-c-config:
  cert-c-workspace:
  cert-c-token:
  cert-c-runtime:
  cert-adversary-state:
  cert-adversary-config:
  cert-adversary-workspace:
  cert-adversary-token:
  cert-adversary-runtime:
