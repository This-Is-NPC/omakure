# Canonical Linux Health Plane certification topology.
#
# Four independently stateful packaged nodes on one dedicated network. Every
# node gets its own identity/trust (`state`), config, workspace, token, and
# runtime volume, so no two nodes can share persistence by accident.
#
# The four services are deliberately symmetric. Fleet roles are assigned by
# `.scripts/health-plane-certification.sh` at runtime from the canonical node
# IDs, because the shipped direct transport resolves dial ownership
# deterministically from them (`DirectService::should_initiate`: the lower ID
# dials the higher one). Ranking the freshly generated IDs is what makes the
# gate deterministic instead of a coin flip:
#
#   rank 1 (lowest ID)  -> performer-alpha
#   rank 2              -> performer-beta
#   rank 3              -> adversary          (never trusted by the fleet)
#   rank 4 (highest ID) -> conductor          (responder for the whole fleet)
#
# Management HTTP binds 127.0.0.1 inside every container and is never published.
# The only port any node exposes to any other node is the direct transport
# listener on 7879, so the node-to-node Health Plane data path can only ever be
# production Noise. The loopback-published 7879 ports exist for the host-side
# adversary harness, which speaks the same production Noise protocol.
#
# The attempt-exhaustion harness is the one harness that cannot dial in, because
# the shipped dial-ownership rule makes the Performer the initiator toward it.
# It therefore runs as `hp-harness` on this same network rather than on the
# host, so no phase ever requires container-to-host reachability.
#
# The runner owns the project name and removes every volume; do not use this
# file as a persistent deployment sample.
services:
  hp-node-1-token-init: &token-init
    image: omakure-node:health-plane-certification
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/tokens.toml /token/tokens.toml && cp /input/client.token /token/client.token && cp /input/curl.conf /token/curl.conf && chown 10001:10001 /token/tokens.toml /token/client.token /token/curl.conf && chmod 0600 /token/tokens.toml /token/client.token /token/curl.conf
    networks:
      - hp-net
    volumes:
      - hp-node-1-token:/token
      - "${OMAKURE_HP_NODE_1_TOKENS_FILE:?set OMAKURE_HP_NODE_1_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_HP_NODE_1_CLIENT_FILE:?set OMAKURE_HP_NODE_1_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_HP_NODE_1_CURL_FILE:?set OMAKURE_HP_NODE_1_CURL_FILE}:/input/curl.conf:ro"

  hp-node-2-token-init:
    <<: *token-init
    volumes:
      - hp-node-2-token:/token
      - "${OMAKURE_HP_NODE_2_TOKENS_FILE:?set OMAKURE_HP_NODE_2_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_HP_NODE_2_CLIENT_FILE:?set OMAKURE_HP_NODE_2_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_HP_NODE_2_CURL_FILE:?set OMAKURE_HP_NODE_2_CURL_FILE}:/input/curl.conf:ro"

  hp-node-3-token-init:
    <<: *token-init
    volumes:
      - hp-node-3-token:/token
      - "${OMAKURE_HP_NODE_3_TOKENS_FILE:?set OMAKURE_HP_NODE_3_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_HP_NODE_3_CLIENT_FILE:?set OMAKURE_HP_NODE_3_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_HP_NODE_3_CURL_FILE:?set OMAKURE_HP_NODE_3_CURL_FILE}:/input/curl.conf:ro"

  hp-node-4-token-init:
    <<: *token-init
    volumes:
      - hp-node-4-token:/token
      - "${OMAKURE_HP_NODE_4_TOKENS_FILE:?set OMAKURE_HP_NODE_4_TOKENS_FILE}:/input/tokens.toml:ro"
      - "${OMAKURE_HP_NODE_4_CLIENT_FILE:?set OMAKURE_HP_NODE_4_CLIENT_FILE}:/input/client.token:ro"
      - "${OMAKURE_HP_NODE_4_CURL_FILE:?set OMAKURE_HP_NODE_4_CURL_FILE}:/input/curl.conf:ro"

  hp-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: omakure-node:health-plane-certification
    hostname: hp-node-1
    depends_on:
      hp-node-1-token-init:
        condition: service_completed_successfully
    environment: &node-environment
      OMAKURE_TOKENS_FILE: /run/secrets/tokens.toml
    # `--bind 127.0.0.1:7878` without `--allow-non-loopback` is load-bearing:
    # management HTTP is a read surface reachable only from inside its own
    # container, so it can never become the node-to-node data path.
    command: &node-command
      - node
      - serve
      - --bind
      - 127.0.0.1:7878
      - --allow-non-loopback-direct
      - --workers
      - "1"
      - --no-scheduler
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
    networks:
      - hp-net
    ports:
      - "127.0.0.1:${OMAKURE_HP_NODE_1_DIRECT_PORT:-17901}:7879"
    volumes:
      - hp-node-1-state:/var/lib/omakure
      - hp-node-1-config:/etc/omakure
      - hp-node-1-workspace:/workspace
      - hp-node-1-token:/run/secrets
      - hp-node-1-runtime:/run/omakure

  hp-node-2:
    image: omakure-node:health-plane-certification
    hostname: hp-node-2
    depends_on:
      hp-node-2-token-init:
        condition: service_completed_successfully
    environment: *node-environment
    command: *node-command
    networks:
      - hp-net
    ports:
      - "127.0.0.1:${OMAKURE_HP_NODE_2_DIRECT_PORT:-17902}:7879"
    volumes:
      - hp-node-2-state:/var/lib/omakure
      - hp-node-2-config:/etc/omakure
      - hp-node-2-workspace:/workspace
      - hp-node-2-token:/run/secrets
      - hp-node-2-runtime:/run/omakure

  hp-node-3:
    image: omakure-node:health-plane-certification
    hostname: hp-node-3
    depends_on:
      hp-node-3-token-init:
        condition: service_completed_successfully
    environment: *node-environment
    command: *node-command
    networks:
      - hp-net
    ports:
      - "127.0.0.1:${OMAKURE_HP_NODE_3_DIRECT_PORT:-17903}:7879"
    volumes:
      - hp-node-3-state:/var/lib/omakure
      - hp-node-3-config:/etc/omakure
      - hp-node-3-workspace:/workspace
      - hp-node-3-token:/run/secrets
      - hp-node-3-runtime:/run/omakure

  hp-node-4:
    image: omakure-node:health-plane-certification
    hostname: hp-node-4
    depends_on:
      hp-node-4-token-init:
        condition: service_completed_successfully
    environment: *node-environment
    command: *node-command
    networks:
      - hp-net
    ports:
      - "127.0.0.1:${OMAKURE_HP_NODE_4_DIRECT_PORT:-17904}:7879"
    volumes:
      - hp-node-4-state:/var/lib/omakure
      - hp-node-4-config:/etc/omakure
      - hp-node-4-workspace:/workspace
      - hp-node-4-token:/run/secrets
      - hp-node-4-runtime:/run/omakure

  # The attempt-exhaustion harness, used only by the phase that certifies the
  # frozen retry budget over one continuously connected session. It joins the
  # dedicated network as an ordinary peer and speaks the same production Noise
  # protocol as the fleet, so that phase needs no container-to-host
  # reachability at all: the repointed Performer dials `hp-harness:7879` across
  # `hp-net` exactly as it would dial a real Conductor.
  #
  # The runner owns `/harness`: it supplies the adversary's node material there
  # and reads back the readiness marker the harness publishes once its listener
  # is accepting.
  #
  # The uid and the bind-mount path are `:?` rather than defaulted. A default
  # would be `0:0` and `/tmp`, i.e. root with a host directory mounted in, and
  # nothing but the token guards would stop a stray `docker compose up` from
  # arming exactly that. The runner exports both before its first Compose call.
  # The two node ids stay optional because they are only known once roles are
  # ranked in Phase 1, and an empty one merely fails the harness assertion.
  hp-harness:
    image: omakure-node-harness:health-plane-certification
    hostname: hp-harness
    # The shipped node context refuses a state directory whose uid/gid differ
    # from the running process (`validate_directory_security`), so the harness
    # runs as the host user that owns the bind-mounted material rather than as
    # root. The runner supplies the real value.
    user: "${OMAKURE_HP_HARNESS_USER:?set OMAKURE_HP_HARNESS_USER}"
    environment:
      OMAKURE_HP_EXHAUSTION_BIND: "0.0.0.0:7879"
      OMAKURE_HP_EXHAUSTION_READY: "/harness/exhaustion.ready"
      OMAKURE_HP_ADVERSARY_STATE: "/harness/adversary-material"
      OMAKURE_HP_ADVERSARY_ID: "${OMAKURE_HP_ADVERSARY_ID:-}"
      OMAKURE_HP_PERFORMER_ID: "${OMAKURE_HP_PERFORMER_ID:-}"
      RUST_BACKTRACE: "1"
    networks:
      - hp-net
    volumes:
      - "${OMAKURE_HP_HARNESS_DIR:?set OMAKURE_HP_HARNESS_DIR}:/harness"

  # Used only by the induced cleanup test. Compose creates hp-node-1 resources,
  # then this service exits non-zero while --abort-on-container-exit is active.
  hp-induced-failure:
    image: omakure-node:health-plane-certification
    depends_on:
      hp-node-1:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 1; exit 42"]
    networks:
      - hp-net

networks:
  hp-net:
    driver: bridge

volumes:
  hp-node-1-state:
  hp-node-1-config:
  hp-node-1-workspace:
  hp-node-1-token:
  hp-node-1-runtime:
  hp-node-2-state:
  hp-node-2-config:
  hp-node-2-workspace:
  hp-node-2-token:
  hp-node-2-runtime:
  hp-node-3-state:
  hp-node-3-config:
  hp-node-3-workspace:
  hp-node-3-token:
  hp-node-3-runtime:
  hp-node-4-state:
  hp-node-4-config:
  hp-node-4-workspace:
  hp-node-4-token:
  hp-node-4-runtime:
