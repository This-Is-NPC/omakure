# Example Compose file for a single-host `omakure node serve` deployment.
#
# Security notes (read docs/deployment.md before production use):
# - Prefer multi-token auth via OMAKURE_TOKENS_FILE / --tokens-file (Argon2id).
#   Legacy OMAKURE_API_TOKEN remains supported when no tokens file is set.
# - Publish on host loopback only (127.0.0.1:7878). The container still binds
#   0.0.0.0:7878 internally so Docker can forward the port.
# - Run as the fixed non-root image principal (uid/gid 10001); prepare bind
#   mounts for that principal instead of overriding `user:`.
# - One replica per workspace volume. SQLite must not be shared across hosts
#   or network filesystems.

services:
  omakure-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: omakure-node:local
    # The image's fixed machine principal is uid/gid 10001. Prepare bind mounts
    # with that ownership; do not override this with an arbitrary host UID.
    user: "10001:10001"
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      # Preferred auth: the read-only tokens TOML mounted below (Argon2id).
      OMAKURE_TOKENS_FILE: /run/secrets/omakure_tokens.toml
      # Legacy alternative: remove OMAKURE_TOKENS_FILE and its volume, then
      # uncomment this line (min 32 random bytes; see deployment.md):
      # OMAKURE_API_TOKEN: "${OMAKURE_API_TOKEN:?set OMAKURE_API_TOKEN}"
      OMAKURE_SCRIPTS_DIR: /workspace
    volumes:
      # Host workspace to container scripts/history/envs root.
      - "${OMAKURE_WORKSPACE:-./workspace}:/workspace"
      # Machine-owned node trust/identity state; never place this in the workspace.
      - "${OMAKURE_NODE_STATE:-./node-state}:/var/lib/omakure"
      # This bind mount requires the file to already exist before `docker compose up`
      # fails to start otherwise. Create it first with `omakure token generate
      # --append secrets/omakure_tokens.toml --confirmed` (see deployment.md
      # Compose example); scopes come from its entries.
      - "${OMAKURE_TOKENS_FILE_HOST:-./secrets/omakure_tokens.toml}:/run/secrets/omakure_tokens.toml:ro"
    # Host publish stays 127.0.0.1 (above). `--allow-non-loopback` is only for
    # the container-internal 0.0.0.0 bind so Docker can forward the port.
    # Legacy --capability applies only with OMAKURE_API_TOKEN (no tokens file).
    # `all` does not bypass --secret-ref; pass explicit refs or '*'.
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --workers
      - "1"
      - --capability
      - scripts:read
      - --capability
      - runs:read
      - --capability
      - runs:write
      - --capability
      - config:read
    restart: unless-stopped

  # Reproducible manual-enrollment topology. Start with:
  # `docker compose up --build enrollment-target enrollment-candidate`.
  enrollment-target-config-init:
    image: omakure-node:enrollment-e2e
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/node.toml /config/node.toml && chown root:10001 /config/node.toml && chmod 0640 /config/node.toml
    volumes:
      - enrollment-target-config:/config
      - ./tests/fixtures/enrollment-target.toml:/input/node.toml:ro

  enrollment-candidate-config-init:
    image: omakure-node:enrollment-e2e
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cp /input/node.toml /config/node.toml && chown root:10001 /config/node.toml && chmod 0640 /config/node.toml
    volumes:
      - enrollment-candidate-config:/config
      - ./tests/fixtures/enrollment-candidate.toml:/input/node.toml:ro

  enrollment-target:
    build:
      context: .
      dockerfile: Dockerfile
    image: omakure-node:enrollment-e2e
    hostname: enrollment-target
    environment:
      "OMAKURE_TOKENS_FILE": /run/secrets/enrollment-target-tokens.toml
    depends_on:
      enrollment-target-config-init:
        condition: service_completed_successfully
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "1"
      - --readiness-requires-worker
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
      - --capability
      - discovery:read
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 3
          http://127.0.0.1:7878/v1/ready
          | jq -e '.ok == true and .data.status == "ready"' >/dev/null
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - enrollment-target-state:/var/lib/omakure
      - enrollment-target-config:/etc/omakure
      - "${OMAKURE_ENROLLMENT_TARGET_TOKENS_FILE:?set OMAKURE_ENROLLMENT_TARGET_TOKENS_FILE}:/run/secrets/enrollment-target-tokens.toml:ro"
      - "${OMAKURE_ENROLLMENT_TARGET_CLIENT_FILE:?set OMAKURE_ENROLLMENT_TARGET_CLIENT_FILE}:/run/secrets/client.token:ro"
    ports:
      - "127.0.0.1:17878:7878"
      - "127.0.0.1:17988:7988"

  enrollment-candidate:
    image: omakure-node:enrollment-e2e
    hostname: enrollment-candidate
    depends_on:
      enrollment-target:
        condition: service_healthy
      enrollment-candidate-config-init:
        condition: service_completed_successfully
    environment:
      "OMAKURE_TOKENS_FILE": /run/secrets/enrollment-candidate-tokens.toml
    command:
      - node
      - serve
      - --bind
      - 0.0.0.0:7878
      - --allow-non-loopback
      - --allow-non-loopback-direct
      - --workers
      - "1"
      - --readiness-requires-worker
      - --capability
      - node:read
      - --capability
      - enrollment:read
      - --capability
      - enrollment:write
      - --capability
      - discovery:read
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 3
          http://127.0.0.1:7878/v1/ready
          | jq -e '.ok == true and .data.status == "ready"' >/dev/null
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - enrollment-candidate-state:/var/lib/omakure
      - enrollment-candidate-config:/etc/omakure
      - "${OMAKURE_ENROLLMENT_CANDIDATE_TOKENS_FILE:?set OMAKURE_ENROLLMENT_CANDIDATE_TOKENS_FILE}:/run/secrets/enrollment-candidate-tokens.toml:ro"
      - "${OMAKURE_ENROLLMENT_CANDIDATE_CLIENT_FILE:?set OMAKURE_ENROLLMENT_CANDIDATE_CLIENT_FILE}:/run/secrets/client.token:ro"
    ports:
      - "127.0.0.1:17879:7878"
      - "127.0.0.1:17989:7988"

volumes:
  enrollment-target-state:
  enrollment-candidate-state:
  enrollment-target-config:
  enrollment-candidate-config:
