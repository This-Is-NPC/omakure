[tools]
# PowerShell is deliberately not pinned. It is optional in the product --
# `.ps1` is one of four script kinds and the node reports it unavailable
# when absent -- and pinning "latest" resolved to a preview build that
# aborts on every invocation, which the runtime probe then spawned once
# per node process. Add a specific working version here if you need to
# run `.ps1` scripts locally.
rust = "1.97.1"

[tasks.dev]
description = "Build and run the bounded node-service smoke check"
run = "./.scripts/dev-daemon.sh"

[tasks.node]
description = "Run the authenticated machine node service in the foreground"
run = "OMAKURE_API_TOKEN=\"$(openssl rand -hex 32)\" cargo run --bin omakure -- node serve --workers 1 --capability all"

[tasks.node-service-check]
description = "Run node-service, CLI, HTTP, and policy integration checks"
run = "cargo test --test node_service_e2e --test http_api_e2e --test cli_surface_e2e --test policy_e2e"

[tasks.transport-certification]
description = "Run the complete bounded Linux transport certification and cleanup matrix"
run = "./.scripts/transport-certification.sh"

[tasks.transport-certification-cleanup-test]
description = "Verify certification cleanup after an induced failure"
run = "./.scripts/transport-certification-cleanup-test.sh"

[tasks.health-plane-certification]
description = "Run the complete bounded Linux Health Plane certification"
run = "./.scripts/health-plane-certification.sh"

[tasks.health-plane-certification-cleanup-test]
description = "Verify Health Plane certification cleanup after induced failure and interrupt"
run = "./.scripts/health-plane-certification-cleanup-test.sh"

[tasks.build]
description = "Build the project in debug mode"
run = "cargo build"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.lint]
description = "Run clippy and check formatting"
run = ["cargo clippy --all-targets -- -D warnings", "cargo fmt --check"]

[tasks.install]
description = "Install omakure locally"
run = "cargo install --path ."

[tasks.coverage]
description = "Run tests with tarpaulin and generate HTML coverage report"
run = "cargo tarpaulin --out Html --exclude-files 'src/installer.rs' 'src/app_meta.rs' 'src/main.rs' 'src/cli/trace.rs' 'src/cli/doctor.rs' 'src/cli/uninstall.rs' 'src/cli/update.rs' --skip-clean"
