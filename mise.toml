[tools]
powershell = "latest"
rust = "latest"

[tasks.dev]
description = "Build and run the bounded headless engine smoke check"
run = "./.scripts/dev-daemon.sh"

[tasks.engine]
description = "Build and run the authenticated headless engine in the foreground"
run = "OMAKURE_API_TOKEN=\"$(openssl rand -hex 32)\" cargo run --bin omakure -- engine --workers 1 --capability all"

[tasks.engine-check]
description = "Run the headless CLI, HTTP, and engine integration checks"
run = "cargo test --test engine_e2e --test http_api_e2e --test cli_surface_e2e"

[tasks.build]
description = "Build the project in debug mode"
run = "cargo build"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.lint]
description = "Run clippy and check formatting"
run = ["cargo clippy --all-targets -- -D warnings", "cargo fmt --check"]

[tasks.install]
description = "Install omakure locally"
run = "cargo install --path ."

[tasks.coverage]
description = "Run tests with tarpaulin and generate HTML coverage report"
run = "cargo tarpaulin --out Html --exclude-files 'src/installer.rs' 'src/app_meta.rs' 'src/main.rs' 'src/cli/trace.rs' 'src/cli/doctor.rs' 'src/cli/uninstall.rs' 'src/cli/update.rs' --skip-clean"
